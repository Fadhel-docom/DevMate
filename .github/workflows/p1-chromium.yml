name: P1 IndexedDB CAS Chromium proof

on:
  pull_request:
    branches: ["feature/**"]
  push:
    branches: ["fix/**"]

# Least privilege: this job only reads the repository.
permissions:
  contents: read

jobs:
  chromium-cas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert the checked-out commit is the expected PR head
        run: |
          actual="$(git rev-parse HEAD)"
          echo "TESTED_SHA=$actual"
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "RUNNER_OS=$(. /etc/os-release && echo "$PRETTY_NAME")"
          test "$actual" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install real Chromium and required system libraries
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Locate Chromium executable
        run: |
          bin="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) -perm -u+x | head -n 1)"
          test -n "$bin"
          echo "CHROMIUM_BIN=$bin" >> "$GITHUB_ENV"
      - name: Build and start isolated harness server
        run: |
          npm run build
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/devmate-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/e2e/cas-store-harness/ >/dev/null; then
              echo "Vite harness server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/devmate-vite.log
          exit 1
      - name: Run atomicity, two-tab race and negative-control assertions in Chromium
        env:
          DEVMATE_TEST_URL: http://127.0.0.1:4173
        run: node e2e/cas-store-harness/run-chromium.mjs
      - name: Runner self-test - uncaught page, second-tab and racer-worker exceptions must fail fast
        env:
          DEVMATE_TEST_URL: http://127.0.0.1:4173
          DEVMATE_HARNESS_TIMEOUT_MS: "60000"
        run: |
          for mode in page-exception worker-exception racer-exception; do
            start="$(date +%s)"
            if DEVMATE_HARNESS_QUERY="?selftest=${mode}" node e2e/cas-store-harness/run-chromium.mjs > "/tmp/selftest-${mode}.log" 2>&1; then
              echo "runner PASSED a deliberately failing page (${mode})"; cat "/tmp/selftest-${mode}.log"; exit 1
            fi
            elapsed=$(( $(date +%s) - start ))
            echo "selftest ${mode}: runner failed as expected after ${elapsed}s"
            grep -n "SELFTEST\|monitored\|worker=1" "/tmp/selftest-${mode}.log" | head -n 8
            grep -q "SELFTEST" "/tmp/selftest-${mode}.log" || { echo "failure was not caused by the injected exception"; cat "/tmp/selftest-${mode}.log"; exit 1; }
            test "$elapsed" -lt 45
            if [ "$mode" = "racer-exception" ]; then
              # The failure must be the racer's own in-worker error report, not a timeout or a host/CDP fallback.
              grep -q "Chromium harness failed: racer parent: uncaught: .*SELFTEST racer uncaught exception" "/tmp/selftest-${mode}.log" || { echo "racer-exception did not fail through the racer.js error monitor"; cat "/tmp/selftest-${mode}.log"; exit 1; }
              if grep -q "did not finish within\|timeout after" "/tmp/selftest-${mode}.log"; then echo "racer-exception failed by timeout"; cat "/tmp/selftest-${mode}.log"; exit 1; fi
              test "$elapsed" -lt 20
            fi
          done
          grep -q "worker=1" /tmp/selftest-worker-exception.log || { echo "worker tab was not monitored by the runner"; exit 1; }

  s2-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated S2 harness dependencies
        run: npm install --prefix e2e/s2-browser-persistence
      - name: Audit isolated S2 harness dependencies
        run: npm audit --prefix e2e/s2-browser-persistence --audit-level=high
      - name: Install Chromium
        run: e2e/s2-browser-persistence/node_modules/.bin/playwright install --with-deps chromium
      - name: Run full S2 diagnostic suite
        shell: bash
        run: |
          set +e
          node e2e/s2-browser-persistence/run.mjs --out=out/results-ci.json
          run_status=$?
          set -e
          if [ "$run_status" -gt 1 ]; then
            echo "Harness execution failed (exit $run_status), not a recorded product finding."
            exit "$run_status"
          fi
          S2_RUN_EXIT="$run_status" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("e2e/s2-browser-persistence/out/results-ci.json", "utf8"));
          const known = new Set(["S2-02", "S2-04", "S2-16"]);
          const unexpected = r.scenarios.filter(s => s.status === "ERROR" || (s.status === "FAIL" && !known.has(s.id)));
          const missing = ["S2-02", "S2-04", "S2-16"].filter(id => !r.scenarios.some(s => s.id === id));
          const expectedExit = r.summary.fail || r.summary.error ? 1 : 0;
          if (Number(process.env.S2_RUN_EXIT) !== expectedExit || unexpected.length || missing.length || r.scenarios.length !== 16) {
            console.error(JSON.stringify({ summary: r.summary, unexpected, missing, exit: process.env.S2_RUN_EXIT, expectedExit }, null, 2));
            process.exit(1);
          }
          console.log("S2 full diagnostic completed. Only the three explicitly tracked findings S2-02/S2-04/S2-16 may report FAIL; any new FAIL/ERROR fails this workflow.");
          console.log(JSON.stringify({ summary: r.summary, findings: r.scenarios.filter(s => s.status === "FAIL").map(s => s.id), notTested: r.scenarios.filter(s => s.status === "NOT TESTED").map(s => s.id) }));
          NODE
      - name: Run S2-15/S2-16 focused addendum
        shell: bash
        run: |
          set +e
          node e2e/s2-browser-persistence/run.mjs S2-15 S2-16 --out=out/results-addendum-ci.json
          run_status=$?
          set -e
          if [ "$run_status" -gt 1 ]; then
            echo "Addendum execution failed (exit $run_status), not a recorded product finding."
            exit "$run_status"
          fi
          S2_RUN_EXIT="$run_status" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const r = JSON.parse(readFileSync("e2e/s2-browser-persistence/out/results-addendum-ci.json", "utf8"));
          const s15 = r.scenarios.find(s => s.id === "S2-15");
          const s16 = r.scenarios.find(s => s.id === "S2-16");
          const unexpected = r.scenarios.filter(s => s.status === "ERROR" || (s.status === "FAIL" && s.id !== "S2-16"));
          const expectedExit = r.summary.fail || r.summary.error ? 1 : 0;
          if (Number(process.env.S2_RUN_EXIT) !== expectedExit || !s15 || !s16 || unexpected.length || r.scenarios.length !== 2) {
            console.error(JSON.stringify({ summary: r.summary, unexpected, s15, s16, exit: process.env.S2_RUN_EXIT, expectedExit }, null, 2));
            process.exit(1);
          }
          console.log("S2 addendum completed. S2-16 may report its known data-loss finding; S2-15 must honestly report PASS or NOT TESTED, never a false pass.");
          console.log(JSON.stringify({ summary: r.summary, s15: s15.status, s16: s16.status }));
          NODE
      - name: Upload raw S2 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-chromium-${{ github.sha }}
          path: e2e/s2-browser-persistence/out/results-*.json
          if-no-files-found: warn
